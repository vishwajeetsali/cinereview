name: CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend Tests & Security Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Run Backend Security Tests
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci_test_secret_32_characters_long_key_access
          JWT_REFRESH_SECRET: ci_test_secret_32_characters_long_key_refresh
          CLIENT_URL: http://localhost:3000
        run: |
          cd server
          npx vitest run tests/security.test.ts

  build-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build React Client (Vite)
        run: |
          cd client
          npm run build

  docker-validation:
    name: Docker Multi-Stage Build Verification
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t cinereview-backend ./server

      - name: Build Frontend Docker Image (Multi-Stage Nginx)
        run: |
          docker build -t cinereview-frontend ./client
